name: assemble-app-tsx
on:
  push:
    branches:
      - cursor/p3-widget-share-reminders-e0a6
    paths:
      - .cursor-tmp/**
      - .github/workflows/assemble-app-tsx.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble App.tsx from gzip chunks
        run: bash .cursor-tmp/assemble-app.sh
      - name: Commit App.tsx and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .cursor-tmp
          rm -f .github/workflows/assemble-app-tsx.yml
          git add src/App.tsx
          git add -A .cursor-tmp .github/workflows/assemble-app-tsx.yml
          git commit -m "Assemble src/App.tsx from gzip helpers and remove assemble files"
          git push
